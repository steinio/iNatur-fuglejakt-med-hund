name: Sjekk iNatur

on:
  schedule:
    # ── HVOR OFTE ────────────────────────────────────────────────────────
    # Endre denne ene linja. Tidene er UTC; norsk sommertid er UTC+2.
    #
    #   "0 */6 * * *"    hver 6. time              (4 i døgnet)
    #   "0 */3 * * *"    hver 3. time              (8 i døgnet)   ← nå
    #   "0 * * * *"      hver time
    #   "0 5,15 * * *"   kl. 07 og 17 norsk tid    (2 i døgnet)
    #   "0 6 * * *"      én gang daglig, kl. 08 norsk tid
    #   "*/20 * * * *"   hvert 20. minutt          (tettest fornuftig)
    #
    # GitHub forsinker planlagte kjøringer i offentlige repo, ofte med
    # 10-20 minutter, så tettere enn hvert 20. minutt gir lite igjen.
    #
    # Skru HELT AV uten å endre kode: Actions-fanen → «Sjekk iNatur» →
    # «...» øverst til høyre → Disable workflow. Skrus på igjen samme sted.
    # Du kan fortsatt kjøre manuelt med «Run workflow» når den er avslått.
    - cron: "0 */3 * * *"
  workflow_dispatch:

# En kø av ventende kjøringer er verdiløs: neste kjøring henter uansett
# ferske data. Avbryt heller den gamle enn å bygge opp etterslep.
concurrency:
  group: inatur-check
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Selve jobben: søk, klassifiser, bygg rapport og nettside.
  #
  # Denne er bevisst skilt fra publiseringen. `deploy` krever miljøet
  # github-pages, som har egne regler for hvilke grener som får lov -
  # og de reglene følger ikke automatisk med når standardgrenen endres.
  # Blir publiseringen blokkert, skal vi likevel ha kjørt sjekken og
  # tatt vare på rapporten.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer
        run: pip install -e .

      # Tilstanden avgjør hva som er «nytt» siden sist, og lar oss hoppe
      # over detaljsider for tilbud som ikke er endret.
      - name: Hent lagret tilstand
        uses: actions/cache/restore@v4
        with:
          path: state.db
          key: inatur-state-${{ github.run_id }}
          restore-keys: inatur-state-

      - name: Kjør sjekk
        timeout-minutes: 20
        run: inatur check

      - name: Lagre tilstand
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.db
          key: inatur-state-${{ github.run_id }}

      - name: Last opp tekstrapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport
          path: reports/
          retention-days: 30

      - uses: actions/configure-pages@v5

      - name: Pakk nettsiden
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publiser til GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
