[project]
name = "inatur-fuglejakt-med-hund"
version = "0.1.0"
description = "Finner ledige fuglejaktkort på inatur.no som tillater bruk av hund"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
inatur = "inatur.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["inatur*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
