# Konfigurasjon for iNatur fuglejakt-varsling.

filters:
  # Hvilke hundestatuser som skal rapporteres.
  #   allowed      - klart ja
  #   conditional  - ja, men med dato/forbehold
  #   unclear      - hund nevnt, men uklart om det er lov
  #   no_mention   - hund ikke nevnt i det hele tatt
  #   not_allowed  - klart nei (tas normalt ikke med)
  #
  # Vi tar med unclear og no_mention med vilje: å gå glipp av et lirypekort
  # koster mer enn å få et varsel for mye.
  dog_statuses:
    - allowed
    - conditional
    - unclear
    - no_mention

  # Krev at tilbudet gjelder minst én fugleart (filtrerer bort ren hare-/revejakt).
  require_birds: true

  # Sett til true for å kun få li- og fjellrype.
  priority_only: false

  # Trekningstilbud har søknadsfrist i stedet for direktesalg.
  # Sett til true for kun å få kort du kan kjøpe med én gang.
  skip_lottery: false

  # Maks pris i kroner. null = ingen grense.
  max_price: null

  # Hvilke fylker som HENTES. Tom liste = hele landet, og da får du alle
  # fylker å velge mellom i nedtrekksmenyen på nettsiden.
  # Snevre den inn (f.eks. ["Vestland"]) for raskere kjøringer.
  fylker: []

scraping:
  # Sekunder mellom hver forespørsel. Ikke sett denne under 0.5.
  delay: 0.6
  max_pages: 200
  # Tak på detaljsider per kjøring. Første kjøring dekker altså ikke hele
  # landet - resten tas av de neste kjøringene, og siden vokser gradvis.
  # Slipper at én kjøring tar et kvarter.
  max_details_per_run: 250
  respect_robots: true

site:
  # Fylket nettsiden viser når den åpnes. Kan endres i menyen uten å
  # kjøre noe på nytt - alle hentede fylker ligger allerede i siden.
  default_fylke: Vestland

output:
  db_path: state.db
  report_path: reports/latest.txt
  # HTML-siden som publiseres på GitHub Pages.
  site_path: site/index.html
