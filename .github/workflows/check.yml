name: Sjekk iNatur

on:
  schedule:
    # Jaktsesong (aug-okt): hvert 20. minutt, 05:00-22:00 norsk tid.
    # GitHub forsinker uansett planlagte kjøringer i offentlige repo, så
    # kortere intervall gir i praksis ikke tettere sjekker.
    - cron: "*/20 3-20 * 8-10 *"
    # Resten av året: én gang i timen.
    - cron: "0 * * 1-7,11,12 *"
  workflow_dispatch:

# En kø av ventende kjøringer er verdiløs: neste kjøring henter uansett
# ferske data. Avbryt heller den gamle enn å bygge opp etterslep.
concurrency:
  group: inatur-check
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Selve jobben: søk, klassifiser, bygg rapport og nettside.
  #
  # Denne er bevisst skilt fra publiseringen. `deploy` krever miljøet
  # github-pages, som har egne regler for hvilke grener som får lov -
  # og de reglene følger ikke automatisk med når standardgrenen endres.
  # Blir publiseringen blokkert, skal vi likevel ha kjørt sjekken og
  # tatt vare på rapporten.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer
        run: pip install -e .

      # Tilstanden avgjør hva som er «nytt» siden sist, og lar oss hoppe
      # over detaljsider for tilbud som ikke er endret.
      - name: Hent lagret tilstand
        uses: actions/cache/restore@v4
        with:
          path: state.db
          key: inatur-state-${{ github.run_id }}
          restore-keys: inatur-state-

      - name: Kjør sjekk
        timeout-minutes: 20
        run: inatur check

      - name: Lagre tilstand
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.db
          key: inatur-state-${{ github.run_id }}

      - name: Last opp tekstrapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport
          path: reports/
          retention-days: 30

      - uses: actions/configure-pages@v5

      - name: Pakk nettsiden
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publiser til GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
